<!DOCTYPE html>
<html th:replace="~{base :: layout(~{::section})}">

<section>

    <div class="container mt-4">

        <div class="card shadow border-0">

            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">

                <h3 class="mb-0">Student List</h3>

                <a href="/addstudent" class="btn btn-success btn-sm">
                    Add Student
                </a>

            </div>

            <div class="card-body">

                <div th:if="${msg}" class="alert alert-success">
                    <span th:text="${msg}"></span>
                </div>

                <form action="/viewstudent" method="get" class="row mb-3">

                    <div class="col-md-10">
                        <input type="text"
                               name="keyword"
                               class="form-control"
                               placeholder="Search by roll no, name, email, course, mobile"
                               th:value="${keyword}">
                    </div>

                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            Search
                        </button>
                    </div>

                </form>

                <table class="table table-bordered table-hover align-middle text-center">

                    <thead class="table-dark">
                    <tr>
                        <th>Photo</th>
                        <th>Roll No</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Course</th>
                        <th>Mobile</th>
                        <th>Action</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="std : ${students}">

                        <td>
                            <img th:if="${std.photo != null}"
                                 th:src="@{'/uploads/' + ${std.photo}}"
                                 width="60"
                                 height="60"
                                 style="object-fit: cover; border-radius: 50%;">

                            <span th:if="${std.photo == null}">
                                No Photo
                            </span>
                        </td>

                        <td th:text="${std.rollno}"></td>
                        <td th:text="${std.name}"></td>
                        <td th:text="${std.email}"></td>
                        <td th:text="${std.course}"></td>
                        <td th:text="${std.mobile}"></td>

                        <td>
                            <a th:href="@{/editstudent/{rollno}(rollno=${std.rollno})}"
                               class="btn btn-warning btn-sm">
                                Edit
                            </a>

                            <a th:href="@{/deletestudent/{rollno}(rollno=${std.rollno})}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this student?')">
                                Delete
                            </a>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(students)}">
                        <td colspan="7" class="text-danger fw-bold">
                            No student records found.
                        </td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</section>

</html>
