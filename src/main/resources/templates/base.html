<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CMS - Student Management System</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background-color:#f8f9fa;
}

.navbar-brand{
    font-weight:bold;
}

.footer{
    background:#212529;
    color:white;
    padding:15px;
    text-align:center;
    margin-top:50px;
}

.student-img{
    width:60px;
    height:60px;
    object-fit:cover;
    border-radius:50%;
}

</style>

</head>
<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            CMS
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/addstudent">
                        Add Student
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="/viewstudent">
                        View Students
                    </a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<!-- Main Content -->

<div class="container mt-4" th:replace="${content}">

    <!-- Child page content here -->

</div>

<!-- Footer -->

<div class="footer">

    © 2026 CMS - Student Management System

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
