<!DOCTYPE html>
<html th:replace="~{base :: layout(~{::section})}">

<section>

	<div class="container mt-4">

		<div class="row justify-content-center">

			<div class="col-lg-8">

				<div class="card shadow border-0">

					<div class="card-header bg-primary text-white">

						<h3 class="mb-0">
							Add New Student
						</h3>

					</div>

					<div class="card-body">

						<div th:if="${msg}" class="alert alert-success">

							<span th:text="${msg}"></span>

						</div>

						<form action="/addstudent" method="post" enctype="multipart/form-data">

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label">
										Roll Number
									</label>

									<input type="text" name="rollno" class="form-control" required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label">
										Student Name
									</label>

									<input type="text" name="name" class="form-control" required>

								</div>

							</div>

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label">
										Email Address
									</label>

									<input type="email" name="email" class="form-control" required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label">
										Course
									</label>

									<input type="text" name="course" class="form-control" required>

								</div>

							</div>

							<div class="row">

								<div class="col-md-6 mb-3">

									<label class="form-label">
										Mobile Number
									</label>

									<input type="text" name="mobile" class="form-control" required>

								</div>

								<div class="col-md-6 mb-3">

									<label class="form-label">
										Student Photo
									</label>

									<input type="file" name="photo" class="form-control" accept="image/*">

								</div>

							</div>

							<div class="d-grid gap-2 mt-3">

								<button type="submit" class="btn btn-success">

									Save Student

								</button>

								<a href="/viewstudent" class="btn btn-secondary">

									View Students

								</a>

							</div>

						</form>

					</div>

				</div>

			</div>

		</div>

	</div>

</section>

</html>
