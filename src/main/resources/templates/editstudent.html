<!DOCTYPE html>
<html th:replace="~{base :: layout(~{::section})}">

<section>

    <div class="container mt-4">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow border-0">

                    <div class="card-header bg-warning text-dark">

                        <h3 class="mb-0">Edit Student</h3>

                    </div>

                    <div class="card-body">

                        <form action="/editstudent"
                              method="post"
                              enctype="multipart/form-data"
                              th:object="${studentDto}">

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Roll Number</label>
                                    <input type="text"
                                           th:field="*{rollno}"
                                           class="form-control"
                                           readonly>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Student Name</label>
                                    <input type="text"
                                           th:field="*{name}"
                                           class="form-control"
                                           required>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Email Address</label>
                                    <input type="email"
                                           th:field="*{email}"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Course</label>
                                    <input type="text"
                                           th:field="*{course}"
                                           class="form-control"
                                           required>
                                </div>

                            </div>

                            <div class="row">

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Mobile Number</label>
                                    <input type="text"
                                           th:field="*{mobile}"
                                           class="form-control"
                                           required>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Update Photo</label>
                                    <input type="file"
                                           name="photo"
                                           class="form-control"
                                           accept="image/*">
                                </div>

                            </div>

                            <div class="mb-3" th:if="${oldPhoto != null}">

                                <label class="form-label">Current Photo</label>
                                <br>

                                <img th:src="@{'/uploads/' + ${oldPhoto}}"
                                     width="100"
                                     height="100"
                                     style="object-fit: cover; border-radius: 50%; border: 2px solid #ddd;">

                            </div>

                            <div class="d-grid gap-2 mt-3">

                                <button type="submit"
                                        class="btn btn-warning">

                                    Update Student

                                </button>

                                <a href="/viewstudent"
                                   class="btn btn-secondary">

                                    Back to Student List

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

</html>
